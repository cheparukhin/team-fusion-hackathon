[project]
name = "chrna-hackathon"
version = "0.1.0"
description = "Audited chimeric RNA evidence prioritization proof of concept"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "openpyxl", "requests", "joblib", "matplotlib"]

[project.optional-dependencies]
hic = ["hic-straw==1.3.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
