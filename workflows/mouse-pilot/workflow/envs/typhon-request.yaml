# Solver input, not an environment lock. Scientific tool versions follow the paper.
name: typhon_env
channels:
- conda-forge
- bioconda
dependencies:
- python=3.9
- minimap2=2.24
- k8
- longgf=0.1.2
- samtools==1.15
- pygtftk=1.6.2
- blast=2.13.0
- bedtools
- seqkit=2.4.0
- bedops
- clustalo
- clustalw
- biopython
- r-base=4.2
- r-dplyr
- r-tidyverse
- r-data.table
- r-magrittr
- r-openxlsx
- r-stringr
- r-tidyr
- bioconductor-biostrings
- r-seqinr
- r-pafr
- seqtk
- rename
- pyyaml
- pandas
- openpyxl
- openjdk=11
- bowtie2
- trimmomatic
- velvet
- oases
- blat
- bbmap
- requests
- cmake
- make
- cxx-compiler
- pkg-config
- zlib
- bzip2
- xz
- boost-cpp
- git
- patch
