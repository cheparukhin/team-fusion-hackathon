ill="#172431" font-weight="400" font-style="normal" text-anchor="start">Candidate recovery in the GPU pilot</text><ellipse cx="856.0" cy="524.0" rx="6.0" ry="6.0" fill="#D22D27" stroke="none" stroke-width="1"/><text x="882" y="525.66" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172431" font-weight="400" font-style="normal" text-anchor="start">Assay QC / biological sample counts</text><ellipse cx="856.0" cy="588.0" rx="6.0" ry="6.0" fill="#D22D27" stroke="none" stroke-width="1"/><text x="882" y="589.66" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#172431" font-weight="400" font-style="normal" text-anchor="start">A reliable experimental chimera fold</text><rect x="65" y="720" width="1470" height="68" rx="0" fill="#EBEDFF" stroke="none" stroke-width="1"/><text x="91" y="760.75" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#0000FF" font-weight="700" font-style="normal" text-anchor="start">Next test: complete assay/QC records + independent candidates + targeted junction confirmation.</text></svg>